name: Build ImmortalWrt LuCI App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build IPK Packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: luci-app-serverctl

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download & Extract ImmortalWrt 24.10.6 SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -qO sdk.tar.zst $SDK_URL
          mkdir sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Fix script permissions
        run: |
          chmod +x luci-app-serverctl/root/etc/init.d/serverctl
          chmod +x luci-app-serverctl/root/usr/libexec/rpcd/serverctl

      - name: Prepare Feeds & Environment
        run: |
          cd sdk
          echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" > feeds.conf.default
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci
          
          ln -s ../../luci-app-serverctl package/luci-app-serverctl

      - name: Compile Package
        run: |
          cd sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-serverctl=m" >> .config
          make defconfig
          
          make package/luci-app-serverctl/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-serverctl-ipk
          path: |
            sdk/bin/packages/*/base/luci-app-serverctl_*.ipk
            sdk/bin/packages/*/base/luci-i18n-serverctl-zh-cn_*.ipk
