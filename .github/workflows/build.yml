name: Build luci-app-serverctl

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-serverctl
  SDK_VERSION: "24.10.6"
  TARGET_ARCH: x86_64

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-lib2to3 python3-setuptools python3-dev \
            rsync subversion swig unzip wget cmake curl asciidoc \
            autoconf automake autopoint binutils bison bzip2 cpio \
            device-tree-compiler flex gcc-multilib g++-multilib gperf \
            haveged help2man intltool libc6-dev-i386 libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libreadline-dev \
            libtool lrzsz mkisofs nano ninja-build p7zip p7zip-full patch \
            pkgconf python3-pyelftools libpython3-dev scons squashfs-tools \
            upx-ucl xxd zlib1g-dev bc time coreutils xz-utils zstd

      - name: Cache ImmortalWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/work/openwrt-sdk
          key: ${{ runner.os }}-immortalwrt-sdk-${{ env.SDK_VERSION }}-${{ env.TARGET_ARCH }}

      - name: Download & extract ImmortalWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: >
          set -e;
          SDK_URL="https://downloads.immortalwrt.org/releases/${SDK_VERSION}/targets/x86/64/";
          SDK_FILE=$(curl -sL "$SDK_URL" | grep 'href="[^"]*sdk[^"]*[.]tar[.]zst"' | head -n 1 | sed -n 's/.*href="\([^"]*\)".*/\1/p');
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK file not found at $SDK_URL";
            curl -sL "$SDK_URL" | grep 'href="[^"]*[.]tar[.]zst"' || true;
            exit 1;
          fi;
          echo "Downloading: ${SDK_URL}${SDK_FILE}";
          wget -q "${SDK_URL}${SDK_FILE}";
          mkdir -p /home/runner/work/openwrt-sdk;
          tar --use-compress-program=unzstd -xf "$SDK_FILE" -C /home/runner/work/openwrt-sdk --strip-components=1;
          echo "SDK extracted successfully."

      - name: Prepare build environment
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          set -e
          PKG="${PACKAGE_NAME}"
          rm -f "package/feeds/luci/${PKG}"
          rm -rf "feeds/luci/applications/${PKG}"
          rm -rf "package/${PKG}"
          mkdir -p "package/${PKG}"

          rsync -a --delete "${GITHUB_WORKSPACE}/" "./package/${PKG}/"

          if [ ! -f "./package/${PKG}/Makefile" ]; then
            echo "::error::Makefile not found in package directory"
            ls -laR "package/${PKG}"
            exit 1
          fi
          echo "Source migration OK."

          if [ "${{ github.ref_type }}" = "tag" ]; then
            NEW_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            NEW_REL="1"
          else
            SHORT_SHA=$(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo "local")
            NEW_VER="$(date +%Y.%m.%d)~${SHORT_SHA}"
            NEW_REL="${{ github.run_number }}"
          fi

          if ! grep -q "^PKG_VERSION:=" "./package/${PKG}/Makefile"; then
            sed -i "/^include \$(TOPDIR)\/rules.mk/a PKG_VERSION:=${NEW_VER}" \
              "./package/${PKG}/Makefile"
            sed -i "/^PKG_VERSION:=${NEW_VER}/a PKG_RELEASE:=${NEW_REL}" \
              "./package/${PKG}/Makefile"
          fi
          echo "Version: ${NEW_VER}-r${NEW_REL}"

      - name: Update feeds & install package
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          set -e
          ./scripts/feeds update -a 2>&1 || true
          if ! ./scripts/feeds install -p luci -f ${PACKAGE_NAME} 2>&1; then
            echo "src-link action /feed/" >> feeds.conf
            ./scripts/feeds update -a
            ./scripts/feeds install -p action -f ${PACKAGE_NAME}
          fi

      - name: Build ipk package
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          set -e
          export FORCE_UNSAFE_CONFIGURE=1
          # ✅ 关键修复：defconfig 也要单线程详细输出，并先清理中间文件
          make dirclean
          make defconfig -j1 V=s
          make package/${PACKAGE_NAME}/compile V=s -j1 2>&1 | tee build.log
          echo "=== Build complete ==="

      - name: Collect artifacts
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          find bin/packages -name "*.ipk" -exec cp {} "${GITHUB_WORKSPACE}/dist/" \; || true
          echo "=== Artifacts ==="
          ls -lh "${GITHUB_WORKSPACE}/dist/"

      - name: Upload ipk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-serverctl-${{ env.TARGET_ARCH }}
          path: dist/
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /home/runner/work/openwrt-sdk/build.log
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: luci-app-serverctl-x86_64
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
