name: Build luci-app-serverctl

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-serverctl
  SDK_VERSION: "24.10.6"
  TARGET_ARCH: x86_64

permissions:
  contents: write

jobs:
  build:
    # ✅ 修复：Job name 不支持 env 上下文，直接写死名称
    name: Build x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential rsync unzip zstd coreutils cmake xxd file

      - name: Cache ImmortalWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/work/openwrt-sdk
          key: ${{ runner.os }}-immortalwrt-sdk-${{ env.SDK_VERSION }}-${{ env.TARGET_ARCH }}

      # ✅ 修复：替换了 grep -P 为 grep -E，解决语法错误
      - name: Download & extract ImmortalWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          SDK_URL="https://downloads.immortalwrt.org/releases/${SDK_VERSION}/targets/x86/64/"
          SDK_FILE=$(curl -sL "$SDK_URL" \

            | grep -oE 'href="[^"]*sdk[^"]*\.tar\.zst"' \
            | head -n 1 \
            | sed 's/href="//')
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK file not found at $SDK_URL"
            curl -sL "$SDK_URL" | grep -oE 'href="[^"]*\.tar\.zst"' || true
            exit 1
          fi
          echo "Downloading: ${SDK_URL}${SDK_FILE}"
          wget -q "${SDK_URL}${SDK_FILE}"
          mkdir -p /home/runner/work/openwrt-sdk
          tar --use-compress-program=unzstd -xf "$SDK_FILE" -C /home/runner/work/openwrt-sdk --strip-components=1
          echo "SDK extracted successfully."

      - name: Prepare build environment
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          set -e
          PKG="${PACKAGE_NAME}"
          # 移除 feeds 中可能存在的同名包，确保使用本仓库代码
          rm -f "package/feeds/luci/${PKG}"
          rm -rf "feeds/luci/applications/${PKG}"
          rm -rf "package/${PKG}"
          mkdir -p "package/${PKG}"

          # 复制本仓库源码到 SDK package 目录
          rsync -a --delete "${GITHUB_WORKSPACE}/" "./package/${PKG}/"

          # 验证
          if [ ! -f "./package/${PKG}/Makefile" ]; then
            echo "::error::Makefile not found in package directory"
            ls -laR "package/${PKG}"
            exit 1
          fi
          echo "Source migration OK."

          # 动态版本号：tag → 语义化版本；push → 日期+短哈希
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NEW_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            NEW_REL="1"
          else
            SHORT_SHA=$(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo "local")
            NEW_VER="$(date +%Y.%m.%d)~${SHORT_SHA}"
            NEW_REL="${{ github.run_number }}"
          fi

          # 注入版本号到 Makefile（在 include rules.mk 之后）
          if ! grep -q "^PKG_VERSION:=" "./package/${PKG}/Makefile"; then
            sed -i "/^include \$(TOPDIR)\/rules.mk/a PKG_VERSION:=${NEW_VER}\nPKG_RELEASE:=${NEW_REL}" \
              "./package/${PKG}/Makefile"
          fi
          echo "Version: ${NEW_VER}-r${NEW_REL}"

      - name: Update feeds & install package
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          set -e
          ./scripts/feeds update -a 2>&1 || true
          ./scripts/feeds install -p luci -f ${PACKAGE_NAME} 2>&1 || \
            echo "src-link action /feed/" >> feeds.conf && \
            ./scripts/feeds update -a && \
            ./scripts/feeds install -p action -f ${PACKAGE_NAME}

      - name: Build ipk package
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          set -e
          make defconfig
          make package/${PACKAGE_NAME}/compile V=s -j"$(nproc)" 2>&1 | tee build.log
          echo "=== Build complete ==="

      - name: Collect artifacts
        working-directory: /home/runner/work/openwrt-sdk
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          find bin/packages -name "*.ipk" -exec cp {} "${GITHUB_WORKSPACE}/dist/" \;
          echo "=== Artifacts ==="
          ls -lh "${GITHUB_WORKSPACE}/dist/"

      - name: Upload ipk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-serverctl-${{ env.TARGET_ARCH }}
          path: dist/
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /home/runner/work/openwrt-sdk/build.log
          retention-days: 7

  # ===== Release on tag =====
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: luci-app-serverctl-x86_64
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
